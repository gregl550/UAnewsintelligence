name: Daily Intelligence Briefing

on:
  schedule:
    # 11:00 UTC = 7:00 AM EDT (UTC-4, Mar–Nov) / 6:00 AM EST (UTC-5, Nov–Mar)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # Allows manual "Run workflow" button in GitHub UI

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Kill the job if it somehow hangs beyond 30 min

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
        run: python main.py
